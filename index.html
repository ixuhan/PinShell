<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PinShell</title>
    <!-- 启动首帧兜底：样式表与 JS 就绪前先铺窗口底色并藏住未样式化的 DOM。
         WebView 会在模块脚本执行前先画一帧 HTML，不挡住的话就会闪出原生按钮。
         main.ts 装配完成后给 <html> 加 .app-ready 再放行。 -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0e14;
        color-scheme: dark;
      }
      #titlebar,
      #app {
        visibility: hidden;
      }
      html.app-ready #titlebar,
      html.app-ready #app {
        visibility: visible;
      }
    </style>
  </head>
  <body>
    <!-- 自绘标题栏：原生标题栏已在 tauri.conf.json 里关掉（decorations: false），
         这一条就是窗口顶栏。空白处可拖动窗口、双击最大化；右侧是最小化/最大化/关闭。 -->
    <header id="titlebar">
      <!-- 左：应用名。拖动区跟着名字一起铺满中段，双击最大化。 -->
      <div id="titlebar-drag" data-tauri-drag-region="deep">
        <span id="titlebar-title">PinShell</span>
      </div>
      <!-- 右：项目栏折叠 + 功能栏折叠 + 全局设置，再往右是窗口按钮。 -->
      <div id="titlebar-tools">
        <button id="bar-toggle-left" type="button" data-i18n-title="titlebar.collapseLeft" data-i18n-aria="titlebar.collapseLeft" aria-pressed="false">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <rect class="frame" x="1.5" y="2.5" width="13" height="11" rx="1.5" />
            <path class="frame" d="M6 2.5v11" />
            <path class="bar-fill" d="M1.5 2.5h4.5v11H1.5z" />
          </svg>
        </button>
        <button id="bar-toggle-right" type="button" data-i18n-title="titlebar.collapseRight" data-i18n-aria="titlebar.collapseRight" aria-pressed="false">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <rect class="frame" x="1.5" y="2.5" width="13" height="11" rx="1.5" />
            <path class="frame" d="M10 2.5v11" />
            <path class="bar-fill" d="M10 2.5h4.5v11H10z" />
          </svg>
        </button>
        <button id="settings-open" type="button" data-i18n-title="titlebar.settings" data-i18n-aria="titlebar.settings">
          <svg class="icon-gear" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" />
          </svg>
        </button>
        <button id="win-pin" type="button" data-i18n-title="titlebar.pin" data-i18n-aria="titlebar.pin" aria-pressed="false">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path class="pin-body" d="M4.5 2.4h7l-1 3.3 2.3 1.6H3.2l2.3-1.6-1-3.3Z" />
            <path d="M8 7.3v6" />
          </svg>
        </button>
      </div>
      <div id="titlebar-actions">
        <button id="win-minimize" type="button" data-i18n-title="titlebar.minimize" data-i18n-aria="titlebar.minimize">
          <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 5h8" /></svg>
        </button>
        <button id="win-maximize" type="button" data-i18n-title="titlebar.maximize" data-i18n-aria="titlebar.maximize">
          <svg viewBox="0 0 10 10" aria-hidden="true"><rect x="1.5" y="1.5" width="7" height="7" rx="0.5" /></svg>
        </button>
        <button id="win-close" type="button" data-i18n-title="titlebar.close" data-i18n-aria="titlebar.close">
          <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" /></svg>
        </button>
      </div>
    </header>
    <div id="app">
      <aside id="sidebar">
        <!-- 项目栏：只放项目与会话行。头部三个按钮：全部收起 / 全部展开 / 新建项目；
             整栏不收起，底部常驻全局设置入口（ADR 0008）。 -->
        <section id="sess-panel" class="panel" data-i18n-aria="projects.title">
          <div id="sess-head" class="panel-head pane-static-head">
            <span class="panel-title"><span data-i18n="projects.title">项目</span></span>
            <div class="panel-tools">
              <button id="proj-collapse-all" class="icon-btn" type="button" data-i18n-title="project.collapseAll" data-i18n-aria="project.collapseAll"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M3.5 7.2l4.5-4.4 4.5 4.4M3.5 12.6l4.5-4.4 4.5 4.4" /></svg></button>
              <button id="proj-expand-all" class="icon-btn" type="button" data-i18n-title="project.expandAll" data-i18n-aria="project.expandAll"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M3.5 3.4l4.5 4.4 4.5-4.4M3.5 8.8l4.5 4.4 4.5-4.4" /></svg></button>
              <button id="proj-new" type="button" data-i18n-title="project.new" data-i18n-aria="project.new">＋</button>
            </div>
          </div>
          <div id="sess-body" class="panel-body">
            <div id="sess-list"></div>
          </div>
        </section>
        <div id="sidebar-foot">
          <button id="settings-open-sidebar" type="button" data-i18n-title="titlebar.settings" data-i18n-aria="titlebar.settings">
            <svg class="icon-gear" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" /></svg>
            <span data-i18n="sidebar.settings">设置</span>
          </button>
        </div>
        <!-- 整栏收起后只剩这条竖条：点它展开，宽度与折叠状态会记住 -->
        <button id="sess-expand" hidden data-i18n-title="sidebar.expand"><span data-i18n="projects.title">项目</span></button>
        <!-- 右边缘的拖拽手柄：拖动只改宽度、松手才重排终端 -->
        <div id="sess-resizer" data-i18n-title="sidebar.resize"></div>
      </aside>

      <main id="main">
        <div id="term-host"></div>
        <div id="hud"></div>

        <!-- Ctrl+R：输入条上方的历史检索覆盖层。Enter 只填不送，Esc 恢复草稿。 -->
        <div id="hist-overlay" hidden>
          <div id="hist-head">
            <span id="hist-title"><span data-i18n="history.title">命令历史</span></span>
            <span id="hist-count"></span>
            <button id="hist-clear" data-i18n-title="history.clearHint"><span data-i18n="history.clear">清空本会话</span></button>
            <button id="hist-close" data-i18n-title="history.closeHint">✕</button>
          </div>
          <input
            id="hist-query"
            type="text"
            spellcheck="false"
            autocomplete="off"
            autocapitalize="off"
            data-i18n-ph="history.search"
          />
          <div id="hist-list"></div>
          <div id="hist-foot"><span data-i18n="history.foot">↑↓ 选择 · Enter 填入输入条 · Esc / Ctrl+R 关闭</span></div>
        </div>

        <div id="inputbar-resizer" data-i18n-title="input.resize"></div>
        <div id="inputbar" class="pass">
          <div id="ib-wrap">
            <textarea
              id="ib-input"
              rows="1"
              spellcheck="false"
              autocomplete="off"
              autocapitalize="off"
              data-i18n-ph="input.placeholder"
              disabled
            ></textarea>
            <span id="ib-ghost" aria-hidden="true"></span>
          </div>
          <div id="ib-footer">
            <button id="ib-history" type="button" data-i18n-title="input.historyHint" data-i18n-aria="input.historyHint"><span data-i18n="input.history">历史</span></button>
            <div id="ib-status">
              <span id="own-dot"></span>
              <span id="own-label"></span>
            </div>
            <span id="ib-paused" hidden><span data-i18n="input.paused">暂停中</span></span>
            <div id="ib-actions">
              <button id="ib-override" data-i18n-title="input.overrideHint"><span data-i18n="session.passthrough">直通</span></button>
              <button id="ib-hex" data-i18n-title="input.hexHint" hidden>HEX</button>
              <button id="ib-log" data-i18n-title="input.logHint" hidden><span data-i18n="input.log">日志</span></button>
            </div>
            <button id="ib-send" type="button" data-i18n-title="input.sendHint" data-i18n-aria="input.sendHint" disabled><span data-i18n="input.send">发送</span></button>
          </div>
        </div>
      </main>

      <!-- 文件面板（M4）：默认跟随焦点会话的 CWD，手动导航后转为固定路径 -->
      <aside id="files">
        <div id="files-resizer" data-i18n-title="files.resize"></div>
        <!-- 整栏收起后只剩这条竖条：点它展开，宽度与折叠状态会记住 -->
        <button id="files-expand" data-i18n-title="rightbar.expand" hidden><span data-i18n="rightbar.title">功能</span></button>
        <div id="files-body">
          <section id="shortcuts-panel" class="panel" data-i18n-aria="shortcuts.title">
            <div id="shortcuts-head" class="panel-head">
              <div id="shortcuts-resizer" class="panel-height" data-fold-ignore data-i18n-title="panels.resizeHeight"></div>
              <button id="shortcuts-toggle" class="panel-toggle" type="button" aria-expanded="true" aria-controls="shortcuts-body" data-i18n-title="panel.collapse">
                <span id="shortcuts-chevron" class="panel-chevron" aria-hidden="true">▾</span><span class="panel-title"><span data-i18n="shortcuts.title">快捷指令</span></span>
              </button>
              <div class="panel-tools">
                <button id="shortcuts-select" class="icon-btn" type="button" aria-pressed="false" data-i18n-title="bulk.selectShortcuts" data-i18n-aria="bulk.selectShortcuts"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><rect x="2.5" y="2.5" width="11" height="11" rx="2.5" /><path d="M5.3 8.1l2 2 3.6-4" /></svg></button>
                <button id="shortcuts-new" type="button" data-i18n-title="shortcuts.new">＋</button>
                <button id="shortcuts-import" type="button" data-i18n-title="shortcuts.importHint"><span data-i18n="shortcuts.import">导入</span></button>
                <button id="shortcuts-export" type="button" data-i18n-title="shortcuts.exportHint"><span data-i18n="shortcuts.export">导出</span></button>
              </div>
              <input id="shortcuts-file" type="file" accept="application/json,.json" hidden />
            </div>
            <div id="shortcuts-body" class="panel-body">
              <!-- 批量模式：与左栏会话列表同一条操作栏，勾选后一次删除多条 -->
              <div id="shortcuts-bulk" class="bulk-bar" hidden>
                <button id="shortcuts-select-all" type="button" data-i18n="bulk.selectAll">全选</button>
                <button id="shortcuts-select-invert" type="button" data-i18n="bulk.invert">反选</button>
                <button id="shortcuts-delete-selected" type="button" class="danger" data-i18n-title="bulk.deleteHint">删除</button>
                <button id="shortcuts-select-done" type="button" data-i18n="bulk.done">完成</button>
              </div>
              <div id="shortcuts-list"></div>
              <div id="shortcuts-status" role="status"></div>
            </div>
          </section>
          <!-- 串口列表：只读展示系统枚举到的端口，标出当前焦点串口会话占用的口。
               新建串口会话在会话栏的「＋」菜单里，这个面板不再承担创建入口。 -->
          <section id="ports-panel" class="panel" data-i18n-aria="ports.title">
            <div id="ports-head" class="panel-head">
              <div id="ports-resizer" class="panel-height" data-fold-ignore data-i18n-title="panels.resizeHeight"></div>
              <button id="ports-toggle" class="panel-toggle" type="button" aria-expanded="true" aria-controls="ports-body" data-i18n-title="panel.collapse">
                <span id="ports-chevron" class="panel-chevron" aria-hidden="true">▾</span><span class="panel-title"><span data-i18n="ports.title">串口列表</span></span>
              </button>
              <div class="panel-tools">
                <button id="ports-refresh" type="button" data-i18n-title="sidebar.refreshPorts" data-i18n-aria="sidebar.refreshPorts">⟳</button>
                <button id="ports-auto" type="button" aria-pressed="false" data-i18n-aria="sidebar.autoPorts" data-i18n-title="sidebar.autoPortsOff"><span data-i18n="files.autoShort">刷</span></button>
              </div>
            </div>
            <div id="ports-body" class="panel-body">
              <div id="ports-refreshed" hidden></div>
              <div id="ports-list"></div>
              <div id="ports-status" role="status"></div>
            </div>
          </section>
          <section id="files-panel" class="panel" data-i18n-aria="files.title">
            <div id="files-head" class="panel-head">
              <div id="files-height" class="panel-height" data-fold-ignore data-i18n-title="panels.resizeHeight"></div>
              <button id="files-toggle" class="panel-toggle" type="button" aria-expanded="true" aria-controls="files-main" data-i18n-title="panel.collapse">
                <span id="files-chevron" class="panel-chevron" aria-hidden="true">▾</span><span class="panel-title"><span data-i18n="files.title">文件</span></span>
              </button>
            </div>
            <div id="files-main" class="panel-body">
              <!-- 操作行：按钮多，单独占一行，窄栏时自己换行，不挤标题栏 -->
              <div id="files-tools" class="panel-toolbar">
                <button id="files-mode" class="on" data-i18n-title="files.followHint"><span data-i18n="files.follow">跟随</span></button>
                <button id="files-sort" data-i18n-title="files.sort" data-i18n-aria="files.sort" aria-haspopup="menu">名称 ↑</button>
                <button id="files-refresh" data-i18n-title="files.refresh">⟳</button>
                <button id="files-auto" data-i18n-aria="files.auto" data-i18n-title="files.autoOff"><span data-i18n="files.autoShort">刷</span></button>
                <button id="files-hidden" data-i18n-title="files.hidden"><span data-i18n="files.hiddenShort">隐</span></button>
              </div>
              <div id="files-path"></div>
              <div id="files-refreshed" hidden></div>
              <div id="files-list" tabindex="-1"></div>
              <div id="files-foot"><span data-i18n="files.foot">双击目录进入 · 双击文件填入输入条</span></div>
            </div>
          </section>
        </div>
      </aside>

      <!-- 全局设置：语言、主题、版本与更新。终端字体大小属于会话，放在会话设置里。 -->
      <div id="settings-overlay" hidden>
        <section id="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settings-title">
          <header>
            <h2 id="settings-title" data-i18n="globalSettings.title">全局设置</h2>
            <button id="settings-close" type="button" data-i18n-title="globalSettings.close" data-i18n-aria="globalSettings.close">×</button>
          </header>
          <div class="settings-section">
            <h3 data-i18n="globalSettings.sectionGeneral">常规</h3>
            <label>
              <span data-i18n="globalSettings.language">语言</span>
              <select id="setting-language">
                <option value="zh" data-i18n="globalSettings.langZh">中文</option>
                <option value="en" data-i18n="globalSettings.langEn">English</option>
              </select>
            </label>
            <label>
              <span data-i18n="globalSettings.theme">主题</span>
              <select id="setting-theme">
                <!-- 顺序与 src/theme.ts 的 THEMES 一致：先暗后亮 -->
                <option value="dark" data-i18n="globalSettings.themeDark">暗黑</option>
                <option value="midnight" data-i18n="globalSettings.themeMidnight">深空蓝</option>
                <option value="ember" data-i18n="globalSettings.themeEmber">炭火</option>
                <option value="nord" data-i18n="globalSettings.themeNord">极地雾</option>
                <option value="cream" data-i18n="globalSettings.themeCream">乳白</option>
                <option value="sand" data-i18n="globalSettings.themeSand">沙岩</option>
                <option value="bright" data-i18n="globalSettings.themeBright">明亮</option>
                <option value="mist" data-i18n="globalSettings.themeMist">雾灰</option>
                <option value="paper" data-i18n="globalSettings.themePaper">素纸</option>
              </select>
            </label>
          </div>
          <div class="settings-section">
            <h3 data-i18n="globalSettings.sectionRightBar">功能栏</h3>
            <p class="settings-hint" data-i18n="globalSettings.rightBarHint">勾选要显示的面板，用 ↑ ↓ 调整上下顺序；全部取消即隐藏整条功能栏。</p>
            <ul id="settings-rightbar" class="settings-rightbar">
              <li data-panel="shortcuts">
                <input id="setting-panel-shortcuts" type="checkbox" />
                <label for="setting-panel-shortcuts" data-i18n="shortcuts.title">快捷指令</label>
                <button type="button" data-move="up" data-i18n-title="globalSettings.moveUp" data-i18n-aria="globalSettings.moveUp">↑</button>
                <button type="button" data-move="down" data-i18n-title="globalSettings.moveDown" data-i18n-aria="globalSettings.moveDown">↓</button>
              </li>
              <li data-panel="ports">
                <input id="setting-panel-ports" type="checkbox" />
                <label for="setting-panel-ports" data-i18n="ports.title">串口列表</label>
                <button type="button" data-move="up" data-i18n-title="globalSettings.moveUp" data-i18n-aria="globalSettings.moveUp">↑</button>
                <button type="button" data-move="down" data-i18n-title="globalSettings.moveDown" data-i18n-aria="globalSettings.moveDown">↓</button>
              </li>
              <li data-panel="files">
                <input id="setting-panel-files" type="checkbox" />
                <label for="setting-panel-files" data-i18n="files.title">文件</label>
                <button type="button" data-move="up" data-i18n-title="globalSettings.moveUp" data-i18n-aria="globalSettings.moveUp">↑</button>
                <button type="button" data-move="down" data-i18n-title="globalSettings.moveDown" data-i18n-aria="globalSettings.moveDown">↓</button>
              </li>
            </ul>
          </div>
          <div class="settings-section">
            <h3 data-i18n="globalSettings.sectionAbout">关于</h3>
            <div class="settings-update">
              <span id="settings-version"></span>
              <button id="settings-check-update" type="button" data-i18n="globalSettings.checkUpdate">检查更新</button>
            </div>
            <div class="settings-update"><span id="update-status" role="status"></span></div>
          </div>
          <footer><button id="settings-done" type="button" data-i18n="globalSettings.done">完成</button></footer>
        </section>
      </div>

      <div id="shortcut-overlay" hidden>
        <form id="shortcut-form" autocomplete="off">
          <div id="shortcut-dialog-head"><span id="shortcut-dialog-title"><span data-i18n="shortcuts.title">快捷指令</span></span><button id="shortcut-dialog-close" type="button" data-i18n-title="common.close">×</button></div>
          <label><span data-i18n="shortcuts.nameLabel">名称</span><input id="shortcut-name" type="text" maxlength="80" autocomplete="off" /></label>
          <label><span data-i18n="shortcuts.commandLabel">命令</span><textarea id="shortcut-command" rows="7" spellcheck="false"></textarea></label>
          <fieldset><legend><span data-i18n="shortcuts.modeLegend">点击行为</span></legend><label><input type="radio" name="shortcut-mode" value="execute" checked /> <span data-i18n="shortcuts.execute">执行</span></label><label><input type="radio" name="shortcut-mode" value="fill" /> <span data-i18n="shortcuts.fill">填入</span></label></fieldset>
          <div id="shortcut-dialog-foot"><span id="shortcut-error" role="alert"></span><button id="shortcut-cancel" type="button"><span data-i18n="serial.cancel">取消</span></button><button type="submit"><span data-i18n="shortcuts.save">保存</span></button></div>
        </form>
      </div>

      <!-- 新建会话：传输方式、名称、落点与通道参数一次填完（ADR 0008）。
           串口参数只在创建时填一次，之后随工作区落盘，冷会话按它重连。 -->
      <div id="session-overlay" hidden>
        <form id="session-form" autocomplete="off">
          <div id="session-head">
            <span data-i18n="sessionDialog.title">新建会话</span>
            <button type="button" id="session-close" data-i18n-title="sessionDialog.closeHint">✕</button>
          </div>
          <div id="session-grid">
            <label class="wide"><span data-i18n="sessionDialog.name">名称</span>
              <input id="session-name" type="text" maxlength="40" data-i18n-ph="sessionDialog.namePlaceholder" spellcheck="false" autocomplete="off" autocapitalize="off" />
            </label>
            <fieldset id="session-transport-field" class="wide">
              <legend data-i18n="sessionDialog.transport">传输方式</legend>
              <label><input type="radio" name="transport" value="terminal" checked /> <span data-i18n="sessionDialog.terminal">终端</span></label>
              <label><input type="radio" name="transport" value="serial" /> <span data-i18n="sessionDialog.serial">串口</span></label>
            </fieldset>
            <label class="wide" id="session-placement-field"><span data-i18n="sessionDialog.placement">落点</span>
              <select id="session-placement">
                <option value="fill" data-i18n="placement.fill">填第一格</option>
                <option value="right" selected data-i18n="placement.right">向右切</option>
                <option value="down" data-i18n="placement.down">向下切</option>
                <option value="replace" data-i18n="placement.replace">替换当前格</option>
              </select>
            </label>
            <div id="session-placement-hint" class="wide dialog-hint" hidden data-i18n="placement.replaceHint">替换当前格会删掉被替换会话的历史与快照</div>
          </div>
          <!-- 终端通道：shell profile 与起始目录 -->
          <div id="session-terminal">
            <label class="wide"><span data-i18n="sessionDialog.shell">Shell</span>
              <select id="session-shell"></select>
            </label>
            <label class="wide"><span data-i18n="sessionDialog.cwd">起始目录（可留空）</span>
              <input id="session-cwd" type="text" data-i18n-ph="sessionDialog.cwdPlaceholder" spellcheck="false" autocomplete="off" autocapitalize="off" />
            </label>
          </div>
          <div id="serial-grid">
            <label class="wide"><span data-i18n="serial.port">端口</span>
              <span class="serial-inline">
                <!-- 端口枚举的 ▾ 弹出系统报告的口，也可以直接输入一个没枚举到的名字。 -->
                <input id="serial-port" placeholder="COM3" spellcheck="false" autocomplete="off" autocapitalize="off" />
                <button type="button" id="serial-port-pick" data-i18n-title="serial.portPick" data-i18n-aria="serial.portPick" aria-haspopup="menu">▾</button>
              </span>
            </label>
            <label><span data-i18n="serial.baud">波特率</span>
              <!-- 常用值来自 src/sessionDialogUi.ts 的 COMMON_BAUD_RATES：可直接改数字，也可点箭头挑一个 -->
              <span class="baud-field">
                <input id="serial-baud" type="number" min="50" max="4000000" step="1" value="115200" autocomplete="off" data-i18n-title="serial.baudHint" />
                <button type="button" id="serial-baud-pick" data-i18n-title="serial.baudPick" data-i18n-aria="serial.baudPick" aria-haspopup="menu">▾</button>
              </span>
            </label>
            <label><span data-i18n="serial.dataBits">数据位</span>
              <select id="serial-data">
                <option value="8" selected>8</option>
                <option value="7">7</option>
                <option value="6">6</option>
                <option value="5">5</option>
              </select>
            </label>
            <label><span data-i18n="serial.parity">校验</span>
              <select id="serial-parity">
                <option value="none" selected data-i18n="serial.parityNone">无</option>
                <option value="odd" data-i18n="serial.parityOdd">奇</option>
                <option value="even" data-i18n="serial.parityEven">偶</option>
              </select>
            </label>
            <label><span data-i18n="serial.stopBits">停止位</span>
              <select id="serial-stop">
                <option value="one" selected>1</option>
                <option value="two">2</option>
              </select>
            </label>
            <label><span data-i18n="serial.flow">流控</span>
              <select id="serial-flow">
                <option value="none" selected data-i18n="serial.flowNone">无</option>
                <option value="software">XON/XOFF</option>
                <option value="hardware">RTS/CTS</option>
              </select>
            </label>
            <label><span data-i18n="serial.lineEnding">行结束符</span>
              <select id="serial-ending">
                <option value="crlf" selected>CRLF（\r\n）</option>
                <option value="cr">CR（\r）</option>
                <option value="lf">LF（\n）</option>
              </select>
            </label>
            <label><span data-i18n="serial.sendMode">发送方式</span>
              <select id="serial-mode">
                <option value="line" selected data-i18n="serial.modeLine">行缓冲</option>
                <option value="direct" data-i18n="serial.modeDirect">直发</option>
              </select>
            </label>
          </div>
          <div id="serial-flags">
            <label><input id="serial-dtr" type="checkbox" checked /> DTR</label>
            <label><input id="serial-rts" type="checkbox" checked /> RTS</label>
            <span data-i18n="serial.flagsHint">打开端口时把这两条握手线拉高；多数 USB 转串口需要</span>
          </div>
          <div id="session-error" role="alert"></div>
          <div id="session-foot">
            <button type="button" id="session-cancel"><span data-i18n="serial.cancel">取消</span></button>
            <button type="submit" id="session-create"><span data-i18n="serial.create">创建</span></button>
          </div>
        </form>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
