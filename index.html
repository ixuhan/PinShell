<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PinShell</title>
  </head>
  <body>
    <div id="app">
      <div id="term-host"></div>
      <div id="hud"></div>
      <div id="inputbar" class="pass">
        <span id="own-dot"></span>
        <span id="own-label">未知 · 直通</span>
        <span id="ib-prompt">❯</span>
        <input
          id="ib-input"
          type="text"
          spellcheck="false"
          autocomplete="off"
          autocapitalize="off"
          placeholder="提示符就绪后在这里输入"
          disabled
        />
        <span id="ib-hint">Ctrl+Shift+P 直通 · Ctrl+Shift+L 锁定</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
