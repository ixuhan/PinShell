<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PinShell</title>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div id="sess-head">
          <span>会话</span>
          <button id="sess-new" title="新建终端会话">＋</button>
          <button id="sess-serial" title="新建串口会话">⌁</button>
          <button id="sess-collapse" title="收起会话栏">‹</button>
        </div>
        <!-- 收起后只剩这条竖条：点它展开，宽度与折叠状态会记住 -->
        <button id="sess-expand" title="展开会话栏" hidden>会话</button>
        <div id="sess-list"></div>
        <div id="sess-hint">双击名字改名 · ✕ 关闭</div>
        <!-- 右边缘的拖拽手柄：和文件面板一样，拖动只改宽度、松手才重排终端 -->
        <div id="sess-resizer" title="拖动调整会话栏宽度 · 双击恢复默认"></div>
      </aside>

      <main id="main">
        <div id="term-host"></div>
        <div id="hud"></div>

        <!-- Ctrl+R：输入条上方的历史检索覆盖层。Enter 只填不送，Esc 恢复草稿。 -->
        <div id="hist-overlay" hidden>
          <div id="hist-head">
            <span id="hist-title">命令历史</span>
            <span id="hist-count"></span>
            <button id="hist-clear" title="只清空当前会话的命令历史">清空本会话</button>
            <button id="hist-close" title="关闭（Esc）">✕</button>
          </div>
          <input
            id="hist-query"
            type="text"
            spellcheck="false"
            autocomplete="off"
            autocapitalize="off"
            placeholder="检索（含大写则区分大小写）"
          />
          <div id="hist-list"></div>
          <div id="hist-foot">↑↓ 选择 · Enter 填入输入条 · Esc / Ctrl+R 关闭</div>
        </div>

        <div id="inputbar" class="pass">
          <span id="own-dot"></span>
          <span id="own-label">未知 · 直通</span>
          <span id="ib-prompt">❯</span>
          <div id="ib-wrap">
            <input
              id="ib-input"
              type="text"
              spellcheck="false"
              autocomplete="off"
              autocapitalize="off"
              placeholder="提示符就绪后可在这里输入"
              disabled
            />
            <!-- Ghost Text：光标后灰色建议，→ 接受；输入框本身保持真实文本与光标 -->
            <span id="ib-ghost" aria-hidden="true"></span>
          </div>
          <span id="ib-paused" hidden>暂停中</span>
          <div id="ib-actions">
            <button id="ib-hex" title="HEX 模式：输入按整行十六进制发送（空格、逗号分隔；不追加行结束符）" hidden>HEX</button>
            <button id="ib-log" title="打开本会话的串口日志" hidden>日志</button>
            <button id="ib-pause" title="暂停接收输出 · Ctrl+Shift+Space&#10;终端：只冻结画面，输出仍记进回放缓冲；串口：真正释放端口，点「连接」按原配置重开">暂停</button>
            <button id="ib-clear" title="清空本会话屏幕与回放，不动命令历史 · Ctrl+Shift+K">清屏</button>
            <button id="ib-pass" title="锁直通：按键全给通道 · Ctrl+Shift+P">直通</button>
            <button id="ib-take" title="锁输入条：按键不回通道 · Ctrl+Shift+L">接管</button>
          </div>
          <span id="ib-hint">↑ 历史 · Ctrl+R 检索</span>
        </div>
      </main>

      <!-- 文件面板（M4）：默认跟随焦点会话的 CWD，手动导航后转为固定路径 -->
      <aside id="files">
        <div id="files-resizer" title="拖动调整宽度 · 双击恢复默认"></div>
        <button id="files-expand" title="展开文件面板" hidden>◧</button>
        <div id="files-body">
          <div id="files-head">
            <button id="files-mode" class="on" title="跟随当前会话的 CWD">跟随</button>
            <button id="files-up" title="上一级">↑</button>
            <button id="files-refresh" title="刷新">⟳</button>
            <button id="files-auto" title="自动刷新：每 3 秒一次（大目录自动放慢）">自动</button>
            <button id="files-hidden" title="显示隐藏项（以点开头或带隐藏属性）">隐</button>
            <button id="files-collapse" title="收起面板">›</button>
          </div>
          <div id="files-path"></div>
          <div id="files-list"></div>
          <div id="files-foot">双击目录进入 · 双击文件填入输入条</div>
        </div>
      </aside>

      <!-- 新建串口会话：连接参数只在创建时填一次，之后随工作区落盘，冷会话按它重连 -->
      <div id="serial-overlay" hidden>
        <form id="serial-form">
          <div id="serial-head">
            <span>新建串口会话</span>
            <button type="button" id="serial-close" title="关闭（Esc）">✕</button>
          </div>
          <div id="serial-grid">
            <label class="wide">端口
              <span class="serial-inline">
                <input id="serial-port" list="serial-port-list" placeholder="COM3" spellcheck="false" autocomplete="off" autocapitalize="off" />
                <button type="button" id="serial-refresh" title="重新枚举串口">⟳</button>
              </span>
            </label>
            <datalist id="serial-port-list"></datalist>
            <label>波特率
              <input id="serial-baud" type="number" min="50" max="4000000" step="1" value="115200" />
            </label>
            <label>数据位
              <select id="serial-data">
                <option value="8" selected>8</option>
                <option value="7">7</option>
                <option value="6">6</option>
                <option value="5">5</option>
              </select>
            </label>
            <label>校验
              <select id="serial-parity">
                <option value="none" selected>无</option>
                <option value="odd">奇</option>
                <option value="even">偶</option>
              </select>
            </label>
            <label>停止位
              <select id="serial-stop">
                <option value="one" selected>1</option>
                <option value="two">2</option>
              </select>
            </label>
            <label>流控
              <select id="serial-flow">
                <option value="none" selected>无</option>
                <option value="software">XON/XOFF</option>
                <option value="hardware">RTS/CTS</option>
              </select>
            </label>
            <label>行结束符
              <select id="serial-ending">
                <option value="crlf" selected>CRLF（\r\n）</option>
                <option value="cr">CR（\r）</option>
                <option value="lf">LF（\n）</option>
              </select>
            </label>
            <label>发送方式
              <select id="serial-mode">
                <option value="line" selected>行缓冲</option>
                <option value="direct">直发</option>
              </select>
            </label>
          </div>
          <div id="serial-flags">
            <label><input id="serial-dtr" type="checkbox" checked /> DTR</label>
            <label><input id="serial-rts" type="checkbox" checked /> RTS</label>
            <span>打开端口时把这两条握手线拉高；多数 USB 转串口需要</span>
          </div>
          <div id="serial-error"></div>
          <div id="serial-foot">
            <span id="serial-ports-hint"></span>
            <button type="button" id="serial-cancel">取消</button>
            <button type="submit" id="serial-create">创建</button>
          </div>
        </form>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
