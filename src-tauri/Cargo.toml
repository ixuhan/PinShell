[package]
name = "pinshell"
version = "0.1.0"
description = "PinShell - Windows enhanced workflow terminal"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
core-domain = { path = "core-domain" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }

# 关掉 WebView2 的浏览器加速键（Ctrl+R 不再是「刷新页面」）需要直接拿到 WebView2 设置。
[target."cfg(windows)".dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
